name: Scientific ask tell process qualification
on:
  pull_request:
    paths: ['forge-bridge/**', 'forge-core/**', 'Cargo.*', 'scripts/check-scientific-search-process.py', 'docs/SCIENTIFIC_ASK_TELL.md', '.github/workflows/scientific-ask-tell.yml']
  push:
    branches: [main]
    paths: ['forge-bridge/**', 'forge-core/**', 'Cargo.*', 'scripts/check-scientific-search-process.py', 'docs/SCIENTIFIC_ASK_TELL.md', '.github/workflows/scientific-ask-tell.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scientific-ask-tell-${{ github.ref }}
  cancel-in-progress: true
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-C debuginfo=0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p forge-bridge --all-targets
      - run: cargo clippy --locked -p forge-bridge --all-targets -- -D warnings
      - run: cargo build --locked -p forge-bridge --example scientific_search
      - run: python3 scripts/check-scientific-search-process.py --worker target/debug/examples/scientific_search
